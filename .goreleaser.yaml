# Builds release binaries when a v* tag is pushed (see .github/workflows/release.yml).
version: 2
project_name: cryptopulse

builds:
  - id: cryptopulse
    binary: cryptopulse
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - readme.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md (passed with --release-notes).
changelog:
  disable: true
