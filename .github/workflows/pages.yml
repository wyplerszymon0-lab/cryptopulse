name: Dashboard

# Rebuilds the live dashboard with fresh CoinGecko data every day.
on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Generate data
        # Coins come from the repository variable DASHBOARD_COINS (Settings ->
        # Secrets and variables -> Actions -> Variables), comma-separated
        # CoinGecko IDs. Passed through env, never pasted into the script.
        env:
          DASHBOARD_COINS: ${{ vars.DASHBOARD_COINS || 'bitcoin,ethereum,solana' }}
        run: |
          mkdir site
          cp web/index.html web/style.css web/app.js site/
          go run . --days 365 --coins "$DASHBOARD_COINS" --export site/data.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
