name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# CI only reads the code.
permissions:
  contents: read

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test ./... -v -count=1 -race -timeout 120s

      - name: Build
        run: go build -ldflags="-s -w" -o predictor .

      - name: Verify binary runs
        run: ./predictor --version

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cryptopulse:ci
